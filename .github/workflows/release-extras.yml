# Post-release publishing that cargo-dist does not own. Tag-scoped; a green
# no-op until its credential secret is configured:
#   - CARGO_REGISTRY_TOKEN → cargo publish to crates.io (the name `cargo
#     login` itself uses)
# Homebrew tap publishing stays with cargo-dist's own
# publish-homebrew-formula job in release.yml — do not duplicate it here.
# The crate is only published after EVERY check run on the tag commit (CI
# and the Release build itself) has finished green.
# Secrets are repository settings; see AGENTS.md "Release".
name: Release extras

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"
  # manual re-run for an existing tag (e.g. after rotating a credential);
  # dispatch with --ref <tag> so the crate content matches the tag
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-extras-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-checks:
    name: Wait for CI and Release checks on the tag
    runs-on: ubuntu-latest
    steps:
      - name: Block until all check runs on this commit are green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # an annotated tag resolves to the tag object — peel to the commit
          sha="$(git ls-remote "$repo" "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)"
          [ -n "$sha" ] || sha="$(git ls-remote "$repo" "${GITHUB_REF_NAME}" | cut -f1)"
          echo "waiting on checks for ${GITHUB_REF_NAME} (${sha})"
          for i in $(seq 1 120); do
            out="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
              --jq '[.check_runs[] | .status + "/" + (.conclusion // "")] | join(" ")')"
            echo "attempt ${i}: ${out:-no check runs yet}"
            case "$out" in
              ""|*"queued/"*|*"in_progress/"*|*"pending/"*) sleep 30; continue ;;
            esac
            if printf '%s' "$out" | grep -qv '/success'; then
              echo "a check run did not succeed:" "$out" >&2
              exit 1
            fi
            exit 0
          done
          echo "check runs did not settle within 60 minutes" >&2
          exit 1

  publish-crates:
    name: Publish to crates.io
    needs: [wait-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CRATES_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: ${{ env.CRATES_TOKEN != '' }}
        run: cargo publish --locked --token "$CRATES_TOKEN"
