# Temporary diagnostic: what can GITHUB_TOKEN actually do on /releases?
name: Debug token
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe release create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          gh api repos/${GITHUB_REPOSITORY}/releases -X POST \
            -f tag_name=v0.2.0 -f name="token-probe" -f body="probe" 2>&1 | head -5
          echo "---"
          gh api repos/${GITHUB_REPOSITORY}/releases --jq '.[].tag_name' 2>&1 | head -3
